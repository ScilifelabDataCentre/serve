{% load get_setting %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User account deleted from SciLifeLab Serve</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }
        .email-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h1>User account deleted from SciLifeLab Serve</h1>
        <p>Dear {{ user_firstname }},</p>
        <p>Your user account {{ user_username }} was deleted from SciLifeLab Serve (<a href="https://{% get_setting 'DOMAIN' %}">https://{% get_setting 'DOMAIN' %}</a>) as requested.</p>
        <p>Kind regards,</p>
        <p>SciLifeLab Serve team</p>
    </div>
</body>
</html>
