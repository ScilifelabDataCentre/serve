<div class="modal fade" id="creatorsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="creatorsModalLabel">Add creator</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <!-- ORCID Search - Optional but auto-populates fields -->
          <div class="col-md-6 position-relative">
            <label for="newCreatorOrcid" class="form-label fw-bold">ORCID ID <small class="text-muted">(optional)</small></label>
            <div class="input-group">
              <input type="text" class="form-control" id="newCreatorOrcid" placeholder="Name or ORCID ID">
              <span class="input-group-text" id="orcidSearchLoading" style="display: none;">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              </span>
            </div>
            <div id="orcidSuggestions" class="list-group position-absolute w-100" style="display: none; z-index: 1000; max-height: 200px; overflow-y: auto; border: 1px solid #ced4da; border-radius: 0.375rem; margin-top: 1px;"></div>
            <small class="form-text text-muted">Search by name or ORCID ID</small>
          </div>
          <!-- Affiliation - Required -->
          <div class="col-md-6 position-relative">
            <label for="newCreatorAffiliation" class="form-label fw-bold">Affiliation <span class="text-danger">*</span></label>
            <div class="input-group">
              <input type="text" class="form-control" id="newCreatorAffiliation" placeholder="Affiliation" required>
              <span class="input-group-text" id="affiliationSearchLoading" style="display: none;">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              </span>
            </div>
            <input type="hidden" id="newCreatorRorData" value="">
            <input type="hidden" id="newCreatorOrcidAffiliationData" value="">
            <div id="affiliationSuggestions" class="list-group position-absolute w-100" style="display: none; z-index: 1000; max-height: 200px; overflow-y: auto; border: 1px solid #ced4da; border-radius: 0.375rem; margin-top: 1px;"></div>
          </div>
          <!-- Name fields - Required and editable -->
          <div class="col-md-6">
            <label for="newCreatorName" class="form-label fw-bold">First Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="newCreatorName" placeholder="First name" required>
          </div>
          <div class="col-md-6">
            <label for="newCreatorLastName" class="form-label fw-bold">Last Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="newCreatorLastName" placeholder="Last name" required>
          </div>
        </div>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">✕ Cancel</button>

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-primary" id="saveAndAddAnotherCreatorBtn" disabled>✓ Save and add another</button>
          <button type="button" class="btn btn-primary" id="saveCreatorBtn" disabled>✓ Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ---- DOM refs ----
  const hiddenField          = document.querySelector('input[name="creators"]');
  const creatorsListEl       = document.getElementById('creatorsSortableList');
  const addBtn               = document.getElementById('addCreatorBtn');
  const modalEl              = document.getElementById('creatorsModal');
  const bsModal              = new bootstrap.Modal(modalEl);

  const nameInput            = document.getElementById('newCreatorName');
  const lastNameInput        = document.getElementById('newCreatorLastName');
  const affiliationInput     = document.getElementById('newCreatorAffiliation');
  const orcidInput           = document.getElementById('newCreatorOrcid');
  const rorDataEl            = document.getElementById('newCreatorRorData');
  const orcidAffDataEl       = document.getElementById('newCreatorOrcidAffiliationData');
  const affiliationSuggestEl = document.getElementById('affiliationSuggestions');
  const orcidSuggestEl       = document.getElementById('orcidSuggestions');
  const saveBtn              = document.getElementById('saveCreatorBtn');
  const saveAnotherBtn       = document.getElementById('saveAndAddAnotherCreatorBtn');

  // ---- State ----
  const state = { editIndex: null };

  // ---- Utilities ----
  const escapeHtml = (s) =>
    (s || '').replace(/[&<>"']/g, (c) => (
      {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[c]
    ));

  const parseCreators = () => {
    try { return JSON.parse(hiddenField.value || '[]'); }
    catch { return []; }
  };

  const writeCreators = (list) => {
    hiddenField.value = JSON.stringify(list || []);
    renderCreators();
  };

  // ---- Validation ----
  const syncSaveButtons = () => {
    const valid = !!(nameInput.value.trim() && lastNameInput.value.trim() && affiliationInput.value.trim());
    if (saveBtn) saveBtn.disabled = !valid;
    if (saveAnotherBtn) saveAnotherBtn.disabled = !valid;
  };

  // ---- Modal open / reset ----
  const resetModal = () => {
    state.editIndex = null;
    nameInput.value = '';
    lastNameInput.value = '';
    affiliationInput.value = '';
    orcidInput.value = '';
    rorDataEl.value = '';
    orcidAffDataEl.value = '';
    document.getElementById('creatorsModalLabel').textContent = 'Add creator';
    if (affiliationSuggestEl) affiliationSuggestEl.style.display = 'none';
    if (orcidSuggestEl) orcidSuggestEl.style.display = 'none';
    syncSaveButtons();
  };

  const openAddModal = () => {
    resetModal();
    bsModal.show();
    setTimeout(() => nameInput.focus(), 150);
  };

  const openEditModal = (idx) => {
    const creators = parseCreators();
    const c = creators[idx];
    if (!c) return;

    state.editIndex = idx;
    document.getElementById('creatorsModalLabel').textContent = 'Edit creator';

    nameInput.value = c.name || '';
    lastNameInput.value = c.lastName || '';
    orcidInput.value = c.orcid || '';

    const aff = c.affiliation;
    if (typeof aff === 'string') {
      affiliationInput.value = aff;
      rorDataEl.value = '';
      orcidAffDataEl.value = '';
    } else if (aff && typeof aff === 'object') {
      affiliationInput.value = aff.title || aff.name || '';
      if (aff.ror_id || aff.id) {
        rorDataEl.value = JSON.stringify(aff);
        orcidAffDataEl.value = '';
      } else {
        orcidAffDataEl.value = JSON.stringify(aff);
        rorDataEl.value = '';
      }
    } else {
      affiliationInput.value = '';
      rorDataEl.value = '';
      orcidAffDataEl.value = '';
    }

    if (affiliationSuggestEl) affiliationSuggestEl.style.display = 'none';
    if (orcidSuggestEl) orcidSuggestEl.style.display = 'none';
    syncSaveButtons();
    bsModal.show();
    setTimeout(() => nameInput.focus(), 150);
  };

  // ---- Collect / upsert ----
  const collectModalData = () => {
    const name = nameInput.value.trim().split(',')[0].trim();
    const lastName = lastNameInput.value.trim().split(',')[0].trim();
    const affiliationText = affiliationInput.value.trim();
    const orcid = orcidInput.value.trim();

    if (!name || !lastName || !affiliationText) {
      alert('Please fill in all required fields: First Name, Last Name, and Affiliation.');
      return null;
    }

    // Use structured ROR/ORCID data only when the text still matches the stored name,
    // so that a manually-typed new affiliation never gets overridden by stale structured data.
    let affiliation;
    const rorJson = rorDataEl.value;
    const orcidAffJson = orcidAffDataEl.value;
    if (rorJson) {
      const rorData = JSON.parse(rorJson);
      const rorName = rorData.title || rorData.name || '';
      affiliation = (affiliationText === rorName) ? rorData : affiliationText;
    } else if (orcidAffJson) {
      const orcidData = JSON.parse(orcidAffJson);
      const orcidName = orcidData.name || orcidData.title || '';
      affiliation = (affiliationText === orcidName) ? orcidData : affiliationText;
    } else {
      affiliation = affiliationText;
    }

    return { name, lastName, affiliation, orcid };
  };

  const upsertCreator = (data) => {
    const creators = parseCreators();
    if (state.editIndex === null) {
      creators.push(data);
    } else {
      // Preserve isOwner flag — it must not be lost on edit
      if (creators[state.editIndex]?.isOwner) data.isOwner = true;
      creators[state.editIndex] = data;
    }
    writeCreators(creators);
  };

  // ---- Render ----
  const renderCreators = () => {
    if (!creatorsListEl) return;
    const creators = parseCreators();
    creatorsListEl.innerHTML = creators.map((c, i) => {
      const affName = typeof c.affiliation === 'string'
        ? c.affiliation
        : (c.affiliation?.title || c.affiliation?.name || '');
      let details = '';
      if (affName) details += `Affiliation: ${escapeHtml(affName)}<br>`;
      if (c.orcid) details += `ORCID: ${escapeHtml(c.orcid)}`;
      return `
        <li class="list-group-item d-flex justify-content-between align-items-center"
            style="cursor: move;" data-creator-index="${i}">
          <div>
            <strong>${escapeHtml(c.name)} ${escapeHtml(c.lastName)}</strong>
            ${details ? `<br><small class="text-muted">${details}</small>` : ''}
          </div>
          <div class="d-flex align-items-center gap-2">
            ${c.isOwner ? '<span class="badge bg-secondary">Owner</span>' : `
            <button type="button" class="btn btn-outline-secondary btn-sm"
                    data-edit-creator="${i}" title="Edit creator">
              <i class="fas fa-edit"></i>
            </button>
            <button type="button" class="btn btn-outline-danger btn-sm"
                    data-remove-creator="${i}" title="Remove creator">
              <i class="fas fa-times"></i>
            </button>`}
          </div>
        </li>`;
    }).join('');

    // Re-initialise sortable after every re-render
    if (typeof $ !== 'undefined' && $.ui) {
      try { $(creatorsListEl).sortable('destroy'); } catch (e) { /* not yet initialised */ }
      $(creatorsListEl).sortable({
        placeholder: 'list-group-item bg-light',
        cursor: 'move',
        update: () => {
          // Re-read DOM order and persist to hidden field
          const current = parseCreators();
          const items = creatorsListEl.querySelectorAll('li[data-creator-index]');
          const reordered = Array.from(items)
            .map(li => current[parseInt(li.getAttribute('data-creator-index'), 10)])
            .filter(Boolean);
          hiddenField.value = JSON.stringify(reordered);
          renderCreators();
        }
      });
    }
  };

  // ---- Event delegation for edit / remove ----
  creatorsListEl?.addEventListener('click', (e) => {
    const editBtn   = e.target.closest('[data-edit-creator]');
    const removeBtn = e.target.closest('[data-remove-creator]');
    if (editBtn)   return openEditModal(parseInt(editBtn.getAttribute('data-edit-creator'), 10));
    if (removeBtn) {
      const idx = parseInt(removeBtn.getAttribute('data-remove-creator'), 10);
      const creators = parseCreators();
      creators.splice(idx, 1);
      writeCreators(creators);
    }
  });

  if (addBtn) addBtn.addEventListener('click', openAddModal);

  saveBtn?.addEventListener('click', () => {
    const data = collectModalData();
    if (!data) return;
    upsertCreator(data);
    bsModal.hide();
  });

  saveAnotherBtn?.addEventListener('click', () => {
    const data = collectModalData();
    if (!data) return;
    upsertCreator(data);
    resetModal();
    bsModal.show();
    setTimeout(() => nameInput.focus(), 50);
  });

  [nameInput, lastNameInput, affiliationInput].forEach(el => el?.addEventListener('input', syncSaveButtons));

  // ---- ROR autocomplete ----
  let rorTimer;
  affiliationInput?.addEventListener('input', () => {
    rorDataEl.value = ''; // clear stale structured data whenever user types
    clearTimeout(rorTimer);
    const query = affiliationInput.value.trim();
    if (query.length < 2) { if (affiliationSuggestEl) affiliationSuggestEl.style.display = 'none'; return; }
    rorTimer = setTimeout(() => {
      const spinner = document.getElementById('affiliationSearchLoading');
      if (spinner) spinner.style.display = 'flex';
      fetch(`/api/ror-autocomplete/?query=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => {
          if (spinner) spinner.style.display = 'none';
          if (!affiliationSuggestEl) return;
          affiliationSuggestEl.innerHTML = '';
          if (data.results && data.results.length > 0) {
            data.results.forEach(org => {
              const item = document.createElement('a');
              item.href = '#';
              item.className = 'list-group-item list-group-item-action';
              item.textContent = org.title;
              item.addEventListener('click', (e) => {
                e.preventDefault();
                affiliationInput.value = org.title;
                rorDataEl.value = JSON.stringify(org);
                orcidAffDataEl.value = '';
                affiliationSuggestEl.style.display = 'none';
                syncSaveButtons();
              });
              affiliationSuggestEl.appendChild(item);
            });
            affiliationSuggestEl.style.display = 'block';
          } else {
            affiliationSuggestEl.style.display = 'none';
          }
        })
        .catch(err => {
          if (spinner) spinner.style.display = 'none';
          console.error('ROR autocomplete error:', err);
          if (affiliationSuggestEl) affiliationSuggestEl.style.display = 'none';
        });
    }, 300);
  });
  affiliationInput?.addEventListener('blur', () => {
    setTimeout(() => { if (affiliationSuggestEl) affiliationSuggestEl.style.display = 'none'; }, 200);
  });

  // ---- ORCID autocomplete ----
  let orcidTimer;
  orcidInput?.addEventListener('input', () => {
    clearTimeout(orcidTimer);
    const query = orcidInput.value.trim();
    if (query.length < 2) { if (orcidSuggestEl) orcidSuggestEl.style.display = 'none'; return; }
    orcidTimer = setTimeout(() => {
      const spinner = document.getElementById('orcidSearchLoading');
      if (spinner) spinner.style.display = 'flex';
      fetch(`/api/orcid-search/?query=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(data => {
          if (spinner) spinner.style.display = 'none';
          if (!orcidSuggestEl) return;
          orcidSuggestEl.innerHTML = '';
          if (data.results && data.results.length > 0) {
            data.results.forEach(person => {
              const item = document.createElement('a');
              item.href = '#';
              item.className = 'list-group-item list-group-item-action';
              item.innerHTML = `
                <div class="fw-semibold">${escapeHtml(person.display_name)}</div>
                <small class="text-muted">Click to add this person</small>
              `;
              item.addEventListener('click', (e) => {
                e.preventDefault();
                orcidInput.value = person.orcid;
                if (person.given_name) nameInput.value = person.given_name;
                if (person.family_name) lastNameInput.value = person.family_name;
                if (person.affiliation) {
                  if (typeof person.affiliation === 'object') {
                    affiliationInput.value = person.affiliation.name;
                    orcidAffDataEl.value = JSON.stringify(person.affiliation);
                    rorDataEl.value = '';
                  } else {
                    affiliationInput.value = person.affiliation;
                    orcidAffDataEl.value = '';
                    rorDataEl.value = '';
                  }
                }
                syncSaveButtons();
                orcidSuggestEl.style.display = 'none';
              });
              orcidSuggestEl.appendChild(item);
            });
            orcidSuggestEl.style.display = 'block';
          } else {
            orcidSuggestEl.style.display = 'none';
          }
        })
        .catch(err => {
          const spinner = document.getElementById('orcidSearchLoading');
          if (spinner) spinner.style.display = 'none';
          console.error('ORCID autocomplete error:', err);
          if (orcidSuggestEl) orcidSuggestEl.style.display = 'none';
        });
    }, 300);
  });
  orcidInput?.addEventListener('blur', () => {
    setTimeout(() => { if (orcidSuggestEl) orcidSuggestEl.style.display = 'none'; }, 200);
  });

  // ---- Init ----
  renderCreators();
})();
</script>
