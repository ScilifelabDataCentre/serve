<select class="form-select{% if invalid %} is-invalid{% endif %}" aria-label="List subdomains" name="subdomain" id="id_subdomain" data-app-dropdown="true" data-app-dropdown-placeholder="Select a subdomain" aria-describedby="id_subdomain_helptext{% if invalid %} id_subdomain_error{% endif %}" {% if invalid %}aria-invalid="true" {% endif %}onchange="selectValidation(event)">
    <option value="" {% if initial_subdomain == "" %}selected{% endif %}>-----------------</option>
    {% for option in options_list %}
    {% if option == initial_subdomain %}
    <option value="{{initial_subdomain}}" selected>{{option}}</option>
    {% else %}
    <option value="{{option}}">{{option}}</option>
    {% endif %}
    {% empty %}
    <option value="" selected>No subdomains available in project</option>
    {% endfor %}

</select>
