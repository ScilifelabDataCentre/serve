{% load static %}
{% if project.status == "active" %}

    <script src="{% static 'js/adaptive-polling.js' %}"></script>
    <script>
            function revealCredential(id) {
              var credential = document.getElementById(id);
              if (credential.type === "password") {
                credential.type = "text";

            // Remove the tooltip after 2 seconds
                setTimeout(function() {
                    credential.type = "password";
                }, 8000);

              } else {
                credential.type = "password";
              }
            }


        {
            const apps = JSON.parse("{{ app_ids|escapejs }}")
            const body = new FormData()
            body.append("apps", apps)

            const url = "{% url 'apps:get_status' project.slug %}"
            const csrftoken = getCookie('csrftoken');
            const ACTIVE_STATUS_POLL_MS = 5000;
            const STABLE_STATUS_POLL_MS = 30000;
            const ERROR_STATUS_POLL_MS = 10000;

            const hasActiveStatus = (status) => ["Creating", "Changing"].includes(status)

            const updateStatus = async () => {

                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        'Accept': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },
                    body
                })

                const json = await response.json()
                let hasActiveApps = false

                for (const key in json) {
                    if (Object.hasOwnProperty.call(json, key)) {
                        const { status, statusGroup, latestUserAction, k8sStatus } = json[key]
                        hasActiveApps = hasActiveApps || hasActiveStatus(status)
                        // To match elements with id with this pattern: id="status-customapp-nnn"
                        const querySelector = `#status-${key}`
                        const elements = document.querySelectorAll(querySelector);

                        let statusTxt = status;

                        if (status != "Running" && k8sStatus != null && k8sStatus != "") {
                            statusTxt = status + ": " + k8sStatus;
                        }

                        // Update both the status, the class style, and data attributes
                        elements.forEach(element => {
                            const className = `alert bg-${statusGroup} alert-app-table`;
                            element.className = className;
                            element.innerText = statusTxt;
                            element.dataset.appAction = latestUserAction;
                            element.dataset.k8sAppStatus = k8sStatus;
                            element.title = k8sStatus;
                        });
                    }
                }

                return hasActiveApps
            }

            if ((apps?.length ?? 0) > 0) {
                ServeAdaptivePolling.createPoller({
                    poll: updateStatus,
                    getDelay: hasActiveApps => hasActiveApps ? ACTIVE_STATUS_POLL_MS : STABLE_STATUS_POLL_MS,
                    errorDelay: ERROR_STATUS_POLL_MS,
                    onError: error => console.error("Error updating app status:", error)
                })
            }
        }
    </script>
</div>
{% else %}

    <div class="row">
        <div class="col d-flex justify-content-center">

            {% include 'common/loader.html' %}
        </div>
    </div>

    <script src="{% static 'js/adaptive-polling.js' %}"></script>
    <script>
        {

            const url = "{% url 'projects:get_status' project.slug %}"
            const csrftoken = getCookie('csrftoken');
            const PROJECT_STATUS_POLL_MS = 2000;
            const PROJECT_STATUS_ERROR_POLL_MS = 10000;

            const getStatus = async () => {

                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json',
                        'X-CSRFToken': csrftoken,
                    }
                })

                const json = await response.json()

                if (json.status !== "created") {
                    window.location.reload()
                }
            }

            ServeAdaptivePolling.createPoller({
                poll: getStatus,
                getDelay: () => PROJECT_STATUS_POLL_MS,
                errorDelay: PROJECT_STATUS_ERROR_POLL_MS,
                onError: error => console.error("Error updating project status:", error)
            })

        }
    </script>

{% endif %}
