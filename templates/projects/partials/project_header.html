{% for obj in maintenance_mode %}
{% if obj.message_in_project_dashboard %}
      <div class="justify-content-center" style="">
          <div class="alert alert-warning border" role="alert">
              <div class="text-center mx-4">
                  <i class="bi-exclamation-triangle mx-2"></i>
                  {{ obj.message_in_project_dashboard | safe }}
              </div>
          </div>
      </div>
{% endif %}
{% endfor %}

<div class="d-flex justify-content-between">
  <h3>{{ project.name }}</h3>
  <div class="d-flex">
    <a href="{%  url 'projects:settings' project.slug %}" class="btn btn-primary ms-2" data-cy="settings">
      <i class="bi bi-gear me-1"></i>
      Settings
    </a>
    {% if user.is_authenticated and user.is_staff %}
      <a href="{% url 'admin:projects_project_change' project.id %}" class="btn btn-primary ms-2"
         data-cy="admin-project" target="_blank">
        🐳 Admin view
      </a>
    {% endif %}
  </div>
</div>
