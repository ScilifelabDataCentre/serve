{% for obj in maintenance_mode %}
{% if obj.message_in_project_dashboard %}
      <div class="justify-content-center" style="">
          <div class="alert alert-warning border" role="alert">
              <div class="text-center mx-4">
                  <i class="bi-exclamation-triangle mx-2"></i>
                  {{ obj.message_in_project_dashboard | safe }}
              </div>
          </div>
      </div>
{% endif %}
{% endfor %}

<div class="serve-page-heading d-flex align-items-center justify-content-between gap-3">
  <h3 class="mb-0">{{ project.name }}</h3>
  <div class="serve-page-actions d-flex align-items-center gap-2">
    <a href="{%  url 'projects:settings' project.slug %}" class="btn btn-primary serve-page-action" data-cy="settings">
      <i class="bi bi-gear me-1"></i>
      Settings
    </a>
    {% if user.is_authenticated and user.is_staff %}
      <div class="dropdown serve-admin-menu">
        <button
          type="button"
          class="btn serve-admin-menu-trigger"
          id="projectAdminMenu"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          data-cy="admin-project-menu"
        >
          <span class="serve-admin-menu-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></span>
          <span>Admin View</span>
          <i class="bi bi-chevron-down serve-admin-menu-chevron" aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end serve-admin-menu-dropdown" aria-labelledby="projectAdminMenu">
          <li><h2 class="dropdown-header">Admin tools</h2></li>
          <li>
            <a
              class="dropdown-item"
              href="{% url 'admin:projects_project_change' project.id %}"
              data-cy="admin-project"
              target="_blank"
              rel="noopener"
            >
              <i class="bi bi-gear" aria-hidden="true"></i>
              <span>Project admin page</span>
            </a>
          </li>
          <li>
            <a
              class="dropdown-item"
              href="{% url 'apps:admin_background_tasks' project.slug %}"
              data-cy="admin-background-tasks"
              target="_blank"
              rel="noopener"
            >
              <i class="bi bi-activity" aria-hidden="true"></i>
              <span>Background tasks</span>
            </a>
          </li>
        </ul>
      </div>
    {% endif %}
  </div>
</div>
