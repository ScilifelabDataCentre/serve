<script>
    function toggleDescription(containerId) {
        var container = document.getElementById(containerId);
        var dots = container.querySelector(".description-dots");
        var moreText = container.querySelector(".description-more");
        var btn = container.querySelector(".description-toggle");
        var btnText = btn ? btn.querySelector(".description-toggle-text") : null;
        var isExpanded = dots.style.display === "none";

        if (isExpanded) {
            dots.style.display = "inline";
            moreText.style.display = "none";
        } else {
            dots.style.display = "none";
            moreText.style.display = "inline";
        }

        if (btn && btnText) {
            btn.setAttribute("aria-expanded", String(!isExpanded));
            btnText.textContent = btn.dataset[isExpanded ? "moreLabel" : "lessLabel"] || (isExpanded ? "See more" : "See less");
        }
    }
</script>
