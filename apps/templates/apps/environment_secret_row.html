<div class="environment-secret-row mb-2" data-environment-secret-row>
  <div class="justify-content-between align-items-center gap-2" data-environment-secret-display hidden>
    <div class="row gx-2 overflow-hidden flex-grow-1">
      <div class="col-3 overflow-hidden">
        <div class="environment-variable-caption">Name</div>
        <div class="fw-semibold text-truncate" data-environment-secret-display-name>{{ row.name }}</div>
      </div>
      <div class="col-9 overflow-hidden">
        <div class="environment-variable-caption">Value</div>
        <div class="environment-secret-display-value" data-environment-secret-display-value>{{ row.display_label|default:"Select keys" }}</div>
      </div>
    </div>
    <div class="d-flex gap-1 flex-shrink-0">
      <button type="button" class="btn btn-outline-secondary btn-sm environment-variable-action" data-environment-edit-secret aria-label="Edit secret reference" title="Edit secret reference">
        <i class="fas fa-edit" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-outline-danger btn-sm environment-variable-action" data-environment-remove-secret aria-label="Remove secret reference" title="Remove secret reference">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="row g-2 align-items-start" data-environment-secret-fields>
    <div class="col-md-3">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Name</span>
        <input type="hidden" value="{{ row.name }}" data-environment-secret-name>
        <div class="dropdown flex-grow-1">
          <button type="button" class="form-select text-start environment-secret-name" data-bs-toggle="dropdown" aria-label="Kubernetes Secret: {{ row.name|default:'Select a Secret' }}" aria-expanded="false" data-environment-secret-name-button>
            <span data-environment-secret-name-summary>{{ row.name|default:"Select a Secret" }}</span>
          </button>
          <div class="dropdown-menu environment-secret-name-menu p-2 w-100">
            {% for group in groups %}
              <button type="button" class="dropdown-item rounded text-start" data-environment-secret-option="{{ group.name }}" {% if group.name == row.name %}aria-current="true"{% endif %}>{{ group.name }}</button>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-7">
      <div class="input-group input-group-sm">
        <span class="input-group-text">Value</span>
        <div class="dropdown flex-grow-1">
          <button type="button" class="form-select text-start environment-secret-value" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Secret keys: {{ row.value_label|default:'Select keys' }}" aria-expanded="false" data-environment-secret-value {% if not row.name %}disabled{% endif %}>
            <span data-environment-secret-summary>{{ row.value_label|default:"Select keys" }}</span>
          </button>
          <div class="dropdown-menu environment-secret-key-menu p-2 w-100">
            {% for group in groups %}
              <div data-environment-secret-options="{{ group.name }}" {% if group.name != row.name %}hidden{% endif %}>
                <label class="dropdown-item d-flex align-items-center gap-2 rounded mb-0">
                  <input type="checkbox" class="form-check-input m-0" name="{{ field.html_name }}" value="{{ group.all_token }}" data-environment-select-all {% if group.name == row.name and group.all_token in field.value %}checked{% endif %}>
                  <span class="form-check-label">All keys</span>
                </label>
                {% for key in group.keys %}
                  <label class="dropdown-item d-flex align-items-center gap-2 rounded mb-0">
                    <input type="checkbox" class="form-check-input m-0" name="{{ field.html_name }}" value="{{ key.token }}" data-environment-secret-key {% if group.name == row.name and key.token in field.value %}checked{% endif %}>
                    <span class="form-check-label">{{ key.name }}</span>
                  </label>
                {% endfor %}
              </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-2 d-flex gap-1 align-items-center justify-content-end environment-secret-actions">
      <button type="button" class="btn btn-outline-danger btn-sm environment-variable-action" data-environment-remove-secret aria-label="Remove secret reference" title="Remove secret reference">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-outline-success btn-sm environment-variable-action" data-environment-confirm-secret aria-label="Confirm secret reference" title="Confirm secret reference" hidden>
        <i class="fas fa-check" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <div class="environment-variable-error" data-environment-secret-error role="alert" hidden></div>
</div>
