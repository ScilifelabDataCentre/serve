<div id="div_{{ field.auto_id }}" data-environment-secret-editor>
  {% for error in field.errors %}
    <div class="client-validation-feedback client-validation-invalid">{{ error }}</div>
  {% endfor %}
  {% if field.field.secret_groups %}
    <div data-environment-secret-rows>
      {% for row in field.field.secret_rows %}
        {% include "apps/environment_secret_row.html" with groups=field.field.secret_groups %}
      {% endfor %}
    </div>
    <template data-environment-secret-template>
      {% include "apps/environment_secret_row.html" with row=field.field.blank_row groups=field.field.secret_groups %}
    </template>
  {% else %}
    <p class="environment-secret-empty small mb-0">No approved Secrets yet.</p>
  {% endif %}
</div>
